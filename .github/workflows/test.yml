name: CI/CD Pipeline

on:
  push:
    branches: [ "remote" ]
  pull_request:
    branches: [ "remote" ]

jobs:
  test:
    runs-on: self-hosted   # or ubuntu-latest if you want GitHub's runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run tests with JSON reporter
        run: |
          npx mocha test/**/*.test.js --reporter json > test-results.json

      - name: Upload test results
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: test-results.json



